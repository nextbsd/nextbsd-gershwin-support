# meson cross file for NextBSD arm64 (aarch64-unknown-freebsd).
#
# Used after the paths file build-gershwin-support.sh writes to
# .build/paths-arm64.ini, which defines the constants used here:
#   bindir     the toolchain image's LLVM 19.1.7 bin directory ($CROSS_BINDIR)
#   sysroot    the staged NextBSD base ($SYSROOT)
#   pc_libdir  the sysroot's pkgconfig directories
# meson setup ... --cross-file .build/paths-arm64.ini --cross-file cross/arm64.ini
#
# The linker is named with c_ld rather than --ld-path in the compiler command:
# meson runs its compile-only checks with -Werror=unused-command-line-argument,
# so a linker flag there would fail every one of them. clang takes ld.lld from
# its own directory. system is 'freebsd' (E23 D12), so upstream FreeBSD code
# paths apply.

[binaries]
c = [bindir / 'clang', '--target=aarch64-unknown-freebsd', '--sysroot=' + sysroot]
cpp = [bindir / 'clang++', '--target=aarch64-unknown-freebsd', '--sysroot=' + sysroot]
c_ld = 'lld'
cpp_ld = 'lld'
ar = bindir / 'llvm-ar'
ranlib = bindir / 'llvm-ranlib'
nm = bindir / 'llvm-nm'
strip = bindir / 'llvm-strip'
objcopy = bindir / 'llvm-objcopy'
readelf = bindir / 'llvm-readelf'
pkg-config = 'pkgconf'

[properties]
sys_root = sysroot
pkg_config_libdir = pc_libdir

[host_machine]
system = 'freebsd'
kernel = 'freebsd'
cpu_family = 'aarch64'
cpu = 'aarch64'
endian = 'little'
