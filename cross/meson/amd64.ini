# Meson cross file: NextBSD amd64.
#
# Used by build-gershwin-support.sh as the SECOND of two --cross-file
# arguments. The first is generated per run (.build/cross/paths-amd64.ini) and
# defines the two constants used here, which depend on the machine doing the
# build:
#   sysroot      the staged NextBSD base, with every earlier component of this
#                repo installed into its /usr
#   llvm_bindir  the toolchain image's pinned clang/lld 19.1.7 ($CROSS_BINDIR)
# Meson lets a later machine file use constants from an earlier one.

[constants]
triple = 'x86_64-unknown-freebsd'
target_args = ['--target=' + triple, '--sysroot=' + sysroot]

[binaries]
c = [llvm_bindir / 'clang'] + target_args
cpp = [llvm_bindir / 'clang++'] + target_args
# -fuse-ld=lld at link time only; clang finds ld.lld beside itself. (A linker
# flag in the compiler command would fail meson's compile-only checks, which
# run with -Werror=unused-command-line-argument.)
c_ld = 'lld'
cpp_ld = 'lld'
ar = llvm_bindir / 'llvm-ar'
ranlib = llvm_bindir / 'llvm-ranlib'
nm = llvm_bindir / 'llvm-nm'
strip = llvm_bindir / 'llvm-strip'
objcopy = llvm_bindir / 'llvm-objcopy'
readelf = llvm_bindir / 'llvm-readelf'
# The ISC pkgconf from the image, never freedesktop's GPL pkg-config.
pkg-config = 'pkgconf'
cmake = 'cmake'

[properties]
needs_exe_wrapper = true
# Meson exports sys_root as PKG_CONFIG_SYSROOT_DIR, so -I/-L from .pc files
# point into the sysroot. Only the sysroot's .pc directories are searched:
# the base, nextbsd-displayserver-support and this repo's components in
# /usr/libdata/pkgconfig, then NextBSD X in /usr/X11/lib/pkgconfig (when
# nextbsd-xlibs is in the sysroot); /usr's comes first, so it wins over
# xlibs' /usr/X11 copies until nextbsd-xlibs#9. Nothing from the Linux build
# host can leak in.
sys_root = sysroot
pkg_config_libdir = [sysroot / 'usr/libdata/pkgconfig', sysroot / 'usr/X11/lib/pkgconfig']

[host_machine]
# 'freebsd', not 'nextbsd' (E23 D12): upstream meson.build files test
# host_machine.system() == 'freebsd' to pick the BSD code paths.
system = 'freebsd'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'
